name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let an in-progress deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build static site
        run: bun run build:pages
        env:
          # "/<repo>/" for a project site, "/" when a custom domain is configured.
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # The Lovable site that serves this project's uploaded images, e.g.
          # https://your-site.lovable.app (set under Settings → Secrets and variables → Actions → Variables).
          LOVABLE_ASSET_ORIGIN: ${{ vars.LOVABLE_ASSET_ORIGIN }}
          # Only needed if the Lovable site is private/preview-gated.
          LOVABLE_PREVIEW_TOKEN: ${{ secrets.LOVABLE_PREVIEW_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
