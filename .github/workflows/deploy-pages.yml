name: Deploy to GitHub Pages

# Lovable syncs to main; pushes to main deploy automatically.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build static site
        run: bun run build:pages
        env:
          # Custom domain serves the site from the root path.
          PAGES_BASE_PATH: "/"
          LOVABLE_ASSET_ORIGIN: ${{ vars.LOVABLE_ASSET_ORIGIN || 'https://id-preview--0c3c6e06-85d4-4361-a04f-dfcd42d2f470.lovable.app' }}
          LOVABLE_PREVIEW_TOKEN: ${{ secrets.LOVABLE_PREVIEW_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
