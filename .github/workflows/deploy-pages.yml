name: Deploy to GitHub Pages

# Lovable syncs to main; pushes to main deploy automatically.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Diagnose DNS and GitHub Pages domain health
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          echo '========== DNS diagnostics (GitHub-hosted runner) =========='
          echo 'These results are not the private resolver/cache used by GitHub Pages validation.'
          echo
          for server in default 8.8.8.8 1.1.1.1 ns21.domaincontrol.com ns22.domaincontrol.com; do
            echo "===== Resolver: $server ====="
            if [ "$server" = default ]; then
              dig +time=3 +tries=1 gowdamalhotra.com A +noall +answer
              dig +time=3 +tries=1 gowdamalhotra.com AAAA +noall +answer
              dig +time=3 +tries=1 www.gowdamalhotra.com CNAME +noall +answer
            else
              dig +time=3 +tries=1 "@$server" gowdamalhotra.com A +noall +answer
              dig +time=3 +tries=1 "@$server" gowdamalhotra.com AAAA +noall +answer
              dig +time=3 +tries=1 "@$server" www.gowdamalhotra.com CNAME +noall +answer
            fi
            echo
          done

          echo '========== Authoritative delegation =========='
          dig +time=3 +tries=1 gowdamalhotra.com NS +noall +answer
          echo
          echo '========== GitHub Pages configuration =========='
          for endpoint in pages pages/health; do
            echo "===== API: ${endpoint} ====="
            status=$(curl --silent --show-error --location --max-time 20 \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --output /tmp/pages-api-response.json \
              --write-out '%{http_code}' \
              "https://api.github.com/repos/${GH_REPO}/${endpoint}")
            echo "HTTP status: ${status}"
            if [ "$endpoint" = pages ]; then
              jq '{status, cname, html_url, build_type, https_enforced, https_certificate, message}' /tmp/pages-api-response.json || cat /tmp/pages-api-response.json
            else
              jq . /tmp/pages-api-response.json || cat /tmp/pages-api-response.json
            fi
            echo
          done
          echo
          echo 'Diagnostics complete; deployment continues regardless of lookup/API errors.'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build static site
        run: bun run build:pages
        env:
          # Custom domain serves the site from the root path. Images and videos are committed under
          # src/assets and bundled by Vite, so nothing is downloaded during the build.
          PAGES_BASE_PATH: "/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
